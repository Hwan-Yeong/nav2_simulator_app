# Checks on every push and pull request; the Docker image is built (not published) for release tags.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          python -m pip install -U pip setuptools
          python -m pip install -e ".[test]"
      - name: Repository checks
        run: python scripts/check.py ${{ startsWith(github.ref, 'refs/tags/v') && format('--release --tag {0}', github.ref_name) || '' }}
      - name: Unit tests
        run: python -m pytest -q

  docker:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t navstudio:ci .
      - name: Doctor inside the image
        run: docker run --rm navstudio:ci navstudio doctor
