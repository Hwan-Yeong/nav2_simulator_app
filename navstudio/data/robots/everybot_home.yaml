name: Everybot 홈 로봇 (듀얼 라이다 · ToF · Depth)
description: 키 60 cm 원형 홈 로봇. 앞뒤 240° 라이다를 /scan 하나로 병합, 바닥 쪽 멀티존 ToF 2개(8×8 중 16존)로 낮은 장애물·단차, 상단 1D ToF 와 depth 카메라로 떠 있는 장애물을 봅니다.
