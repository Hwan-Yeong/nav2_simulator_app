  - {name: mtof_right, model: tof_8x8, type: tof, x: 0.14316, y: -0.075446, z: 0.08, roll_deg: 0, pitch_deg: -5, yaw_deg: -15,
     zones_x: 8, zones_y: 8, fov_h_deg: 45, fov_v_deg: 45, rays_per_zone: 2, range_min: 0.02, range_max: 4.0, hz: 15, noise: 0.005, noise_rel: 0.01,
