<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Studio</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script type="importmap">{"imports": {"three": "/static/vendor/three/three.module.min.js"}}</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 16 L26 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
      <span class="name">Nav Studio</span><span class="by">by Everybot</span>
    </div>
    <nav class="ws-tabs" role="tablist" aria-label="작업 공간">
      <button role="tab" data-ws="sim" aria-selected="true">시뮬레이션</button>
      <button role="tab" data-ws="robot" aria-selected="false">로봇 설계</button>
      <button role="tab" data-ws="bench" aria-selected="false">벤치마크</button>
      <button role="tab" data-ws="tune" aria-selected="false">자동 튜닝</button>
    </nav>
    <div class="session">
      <div class="chips" id="sessionChips"></div>
      <span class="pill" id="stackPill" data-state="stopped"><i></i><b>정지됨</b></span>
      <button class="btn primary" id="btnStart"></button>
      <button class="btn ghost icon-only" id="btnStop" title="시뮬레이션 종료" aria-label="시뮬레이션 종료" hidden></button>
      <button class="btn ghost icon-only" id="btnTheme" title="테마 전환" aria-label="테마 전환"></button>
    </div>
  </header>

  <!-- ============================== simulation workspace ============================== -->
  <main class="ws" id="ws-sim">
    <aside class="side left">
      <div class="seg" role="tablist" id="leftTabs">
        <button role="tab" data-tab="map" aria-selected="true">맵</button>
        <button role="tab" data-tab="setup" aria-selected="false">로봇·스택</button>
        <button role="tab" data-tab="params" aria-selected="false">파라미터 <span class="badge" id="paramCount" hidden></span></button>
      </div>
      <section class="tab" data-tab="map" id="tabMap"></section>
      <section class="tab" data-tab="setup" id="tabSetup" hidden></section>
      <section class="tab" data-tab="params" id="tabParams" hidden></section>
    </aside>

    <section class="stage" id="stage">
      <canvas id="view" aria-label="시뮬레이션 화면"></canvas>
      <div class="tools floating" id="tools" role="toolbar" aria-label="편집 도구"></div>
      <div class="layers floating" id="layers"></div>
      <div class="runbar floating" id="runbar"></div>
      <div class="readout floating" id="readout"></div>
      <div class="toolopts floating" id="toolOpts" hidden></div>
      <div class="overlay" id="stageOverlay" hidden></div>
    </section>

    <aside class="side right" id="telemetry"></aside>
  </main>

  <!-- ============================== robot design workspace ============================== -->
  <main class="ws" id="ws-robot" hidden>
    <aside class="side left wide" id="robotForm"></aside>
    <section class="stage cad" id="cadStage">
      <canvas id="cad" aria-label="로봇 상면도 편집기"></canvas>
      <div class="cadhint floating" id="cadHint"></div>
      <div class="cadtools floating" id="cadTools"></div>
    </section>
    <aside class="side right wide" id="robot3d"></aside>
  </main>

  <!-- ============================== benchmark workspace ============================== -->
  <main class="ws" id="ws-bench" hidden></main>

  <!-- ============================== tuning workspace ============================== -->
  <main class="ws" id="ws-tune" hidden></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h2 id="modalTitle"></h2><button class="btn ghost icon-only" id="modalClose" aria-label="닫기"></button></header>
    <div class="modal-body" id="modalBody"></div>
    <footer id="modalFoot"></footer>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
